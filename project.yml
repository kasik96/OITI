name: OITI
options:
  bundleIdPrefix: com.martinkase
  deploymentTarget: {iOS: "17.0", macOS: "14.0"}
settings:
  base:
    DEVELOPMENT_TEAM: 5DARBK48ZS
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  OITI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Open Infrared Thermal Imager
        UILaunchScreen: {}
        NSCameraUsageDescription: Shows the live image from the USB thermal camera.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinkase.oiti
        PRODUCT_NAME: OITI
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OITIMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [App, Shared]
    info:
      path: App/InfoMac.plist
      properties:
        CFBundleDisplayName: Open Infrared Thermal Imager
        NSCameraUsageDescription: Shows the live image from the USB thermal camera.
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinkase.oiti.mac
        PRODUCT_NAME: OITIMac
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  OITITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
      - Shared
      - path: Tests/Fixtures/device-frame.bin
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.martinkase.oiti.tests
        CODE_SIGN_IDENTITY: "-"
  renderproof:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tools, Shared]
    settings:
      base:
        PRODUCT_NAME: renderproof
        CODE_SIGN_IDENTITY: "-"
schemes:
  OITI:
    build: {targets: {OITI: all}}
  OITIMac:
    build: {targets: {OITIMac: all}}
    run: {}
  OITITests:
    build: {targets: {OITITests: [test]}}
    test: {targets: [OITITests]}
  renderproof:
    build: {targets: {renderproof: all}}
    run: {}
